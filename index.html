<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram • Confirmation</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
background:#0e1621;
font-family:Arial,sans-serif;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
}

.card{
width:92%;
max-width:420px;
background:#17212b;
border-radius:20px;
padding:25px;
text-align:center;
box-shadow:0 0 30px #0008;
}

.logo{
width:65px;
height:65px;
border-radius:50%;
background:#229ed9;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

h1{
font-size:24px;
margin:18px 0 8px;
}

.text{
color:#9eabb7;
font-size:14px;
line-height:1.5;
}

input{
width:100%;
padding:14px;
margin-top:18px;
border-radius:12px;
border:1px solid #34495e;
background:#0e1621;
color:white;
font-size:16px;
text-align:center;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:13px;
border:0;
border-radius:12px;
background:#229ed9;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.98);
}

.success{
color:#4bd889;
margin-top:18px;
}

.error{
color:#ff6868;
margin-top:15px;
}

.hidden{
display:none;
}

.footer{
margin-top:28px;
font-size:11px;
color:#697784;
}

.secret{
color:#697784;
cursor:pointer;
}

.secret:hover{
color:#8b9aa7;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">✈</div>

<h1>Telegram • Confirmation</h1>

<div class="text">
Это сообщение скрыто.<br>
Введите код подтверждения, чтобы продолжить.
</div>

<input
id="code"
type="text"
inputmode="numeric"
placeholder="Введите код"
>

<button onclick="confirmCode()">
Подтвердить
</button>

<div id="result"></div>

<div id="confirmed" class="hidden">

<h2 class="success">✓ Подтверждено</h2>

<div class="text">
Подтверждение успешно выполнено.
</div>

<button onclick="openTelegram()">
Вернуться в Telegram
</button>

</div>

<div class="footer">

Telegram-style • Confirmation

<br><br>

<span
class="secret"
onclick="openAdminLogin()"
>
✓ Подтверждено Telegram
</span>

</div>

</div>

<script>

const CODE = "1732";

function confirmCode(){

const code =
document.getElementById("code").value.trim();

const result =
document.getElementById("result");

const confirmed =
document.getElementById("confirmed");

if(code === CODE){

const history =
JSON.parse(
localStorage.getItem("confirmationHistory") || "[]"
);

history.push({
date:new Date().toLocaleString("ru-RU"),
status:"Подтверждено"
});

localStorage.setItem(
"confirmationHistory",
JSON.stringify(history)
);

result.innerHTML =
'<div class="success">Код правильный.</div>';

confirmed.classList.remove("hidden");

}else{

result.innerHTML =
'<div class="error">Неверный код.</div>';

confirmed.classList.add("hidden");

}

}

function openTelegram(){

window.location.href =
"https://t.me/samuilhl";

}

function openAdminLogin(){

window.location.href =
"admin.html";

}

</script>

</body>
</html>
