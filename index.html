<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram • Confirmation</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
background:#0e1621;
font-family:Arial,sans-serif;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
}

.card{
width:92%;
max-width:420px;
background:#17212b;
border-radius:20px;
padding:25px;
text-align:center;
box-shadow:0 0 30px #0008;
}

.logo{
width:65px;
height:65px;
border-radius:50%;
background:#229ed9;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

h1{
font-size:24px;
margin:18px 0 8px;
}

.text{
color:#9eabb7;
font-size:14px;
line-height:1.5;
}

input{
width:100%;
padding:14px;
margin-top:18px;
border-radius:12px;
border:1px solid #34495e;
background:#0e1621;
color:#fff;
font-size:16px;
text-align:center;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:13px;
border:0;
border-radius:12px;
background:#229ed9;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.98);
}

.success{
color:#4bd889;
}

.error{
color:#ff6868;
}

.warning{
color:#ffbd59;
}

.hidden{
display:none;
}

.footer{
margin-top:28px;
font-size:11px;
color:#697784;
}

.secret{
cursor:pointer;
color:#697784;
}

.secret:hover{
color:#9aa8b5;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">✈</div>

<h1>Telegram • Confirmation</h1>

<div class="text">
Введите код подтверждения,
который вы получили.
</div>

<input
id="code"
type="text"
inputmode="numeric"
placeholder="Введите код"
autocomplete="off"
>

<button onclick="checkCode()">
Подтвердить
</button>

<div id="result"></div>

<div id="confirmed" class="hidden">

<h2 class="success">✓ Подтверждено</h2>

<div class="text">
Код успешно подтверждён.
</div>

<button onclick="returnToTelegram()">
Вернуться в Telegram
</button>

</div>

<div class="footer">

Telegram-style • Confirmation

<br><br>

<span
class="secret"
onclick="openAdmin()"
>
✓ Подтверждено Telegram
</span>

</div>

</div>

<script>

let currentCodeData = null;


/* Получение кодов */

function getCodes(){

return JSON.parse(
localStorage.getItem("confirmationCodes") || "[]"
);

}


/* Проверка кода */

function checkCode(){

const entered =
document.getElementById("code")
.value
.trim();

const result =
document.getElementById("result");

const confirmed =
document.getElementById("confirmed");

confirmed.classList.add("hidden");
currentCodeData = null;

if(!entered){

result.innerHTML =
'<div class="error">Введите код.</div>';

return;

}

const codes = getCodes();

const found =
codes.find(c => c.code === entered);


/* Код не существует */

if(!found){

result.innerHTML =
'<div class="error">❌ Неверный код.</div>';

return;

}


/* Код существует, но выключен */

if(!found.active){

result.innerHTML =
'<div class="warning">⚠️ Этот код больше недействителен.</div>';

return;

}


/* Код правильный */

currentCodeData = found;

result.innerHTML =
'<div class="success">Код подтверждён.</div>';

confirmed.classList.remove("hidden");


/* История */

const history =
JSON.parse(
localStorage.getItem("confirmationHistory") || "[]"
);

history.push({

code:found.code,

name:found.name,

date:new Date().toLocaleString("ru-RU"),

status:"Подтверждено"

});

localStorage.setItem(
"confirmationHistory",
JSON.stringify(history)
);

}


/* Возврат по ссылке кода */

function returnToTelegram(){

if(!currentCodeData){

return;
}

const link =
currentCodeData.returnLink;


/*
Открываем указанную ссылку.
Если это обычная https://t.me/...,
Android обычно предлагает Telegram.
*/

window.location.href = link;

}


/* Скрытая кнопка */

function openAdmin(){

window.location.href = "admin.html";

}

</script>

</body>
</html>
