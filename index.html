<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Админ-панель</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
min-height:100vh;

font-family:Arial,sans-serif;

color:white;

background:
radial-gradient(circle at 15% 15%,#009dff44,transparent 32%),
radial-gradient(circle at 85% 85%,#8b5cf644,transparent 32%),
#07111f;

padding:20px;

}

.panel{

max-width:650px;

margin:auto;

padding:25px;

background:#ffffff12;

border:1px solid #ffffff20;

border-radius:24px;

backdrop-filter:blur(20px);

}

h1{
margin-top:0;
}

.card{

padding:18px;

margin-top:15px;

border-radius:17px;

background:#00000025;

border:1px solid #ffffff12;

}

.green{
color:#55e68a;
font-weight:bold;
}

button{

width:100%;

padding:14px;

margin-top:10px;

border:0;

border-radius:12px;

background:linear-gradient(135deg,#168de2,#287cff);

color:white;

font-weight:bold;

font-size:15px;

}

.logout{
background:#ff4757;
}

</style>

</head>

<body>

<div class="panel">

<h1>⚙️ Админ-панель</h1>


<div class="card">

<h2>👤 Аккаунт</h2>

<p>
Статус:
<span class="green">● Авторизован</span>
</p>

<p>
Telegram:
<strong>@samuilhl</strong>
</p>

</div>


<div class="card">

<h2>🔐 Код сообщения</h2>

<p>
Текущий код:
<strong>1732</strong>
</p>

</div>


<div class="card">

<h2>📊 Подтверждения</h2>

<p>
Подтверждения, сделанные другими пользователями,
эта версия GitHub Pages получить не может.
</p>

<p>
Для этого понадобится сервер или Telegram-бот.
</p>

</div>


<div class="card">

<button onclick="location.href='index.html'">
🌐 Открыть страницу
</button>

<button class="logout" onclick="logout()">
🚪 Выйти
</button>

</div>

</div>


<script>

if(sessionStorage.getItem("adminLogged") !== "true"){

location.href="index.html";

}

function logout(){

sessionStorage.removeItem("adminLogged");

location.href="index.html";

}

</script>

</body>

</html>
